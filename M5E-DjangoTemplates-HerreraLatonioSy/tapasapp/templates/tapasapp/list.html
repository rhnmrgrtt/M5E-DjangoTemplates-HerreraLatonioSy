{% extends 'tapasapp/base.html' %}
{% load static %}

{% block side %}
<ul class="mt-3">
    <li><a href="#">View Wines</a></li>
    <li><a href="#">View Large Dishes</a></li>
    <li><a href="#">View Coursed Menus</a></li>
</ul>
{% endblock %}

{% block content %}
<table class="table table-striped table-bordered mt-3">
    <thead>
        <tr>
            <th scope="col" style="width: 45%;">Name</th>
            <th scope="col" style="width: 20%;">Cooking Time</th>
            <th scope="col" style="width: 20%;">Prep Time</th>
            <th scope="col" style="width: 15%;"></th>
        </tr>
    </thead>
    <tbody>
        {% for d in dishes %}
        <tr>
            <td>{{ d.name }}</td>
            <td>{{ d.cook_time }}</td>
            <td>{{ d.prep_time }}</td>
            <td><button class="btn btn-secondary btn-sm">Details</button></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
